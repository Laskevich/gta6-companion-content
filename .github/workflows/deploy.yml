name: deploy

on:
  push:
    branches: [main]
    paths: ["content/**", "scripts/**", "schema/**", "site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # deploy-pages sometimes can't see a just-uploaded artifact yet ("No artifacts named
      # github-pages"); give it a moment and retry once instead of failing the release.
      - run: sleep 20
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: pages
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
